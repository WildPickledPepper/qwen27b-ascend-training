<!doctype html><html lang="zh"><meta charset="utf-8"><title>训练多泳道</title><style>body{margin:0;background:#101722;color:#e4edf9;font-family:"Microsoft YaHei",sans-serif}nav{position:sticky;top:0;padding:12px 24px;background:#233247;display:flex;gap:12px;align-items:center;z-index:2}button{padding:9px 16px;background:#30455f;color:white;border:1px solid #67809e;border-radius:6px;cursor:pointer}main{overflow:auto}svg{display:block;width:100%;min-width:1100px;font-family:"Microsoft YaHei",sans-serif}rect:hover{filter:brightness(1.12)}</style><nav><button onclick="zoom(1)">适应窗口</button><button onclick="zoom(1.5)">放大1.5倍</button><button onclick="go(150)">A 实测阶段</button><button onclick="go(600)">B 蓝色内部并发</button><button onclick="go(1390)">C 收尾与更新</button><span>A：实测边界　B：机制示意，非设备trace</span></nav><main><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1940" role="img" aria-label="详细训练多泳道时间线"><rect width="1900" height="1940" fill="#101722"/><text x="48" y="63.06" font-size="42" fill="#e4edf9">训练多泳道：CPU梯度累加到底在哪？</text><text x="50" y="117.04" font-size="28" fill="#88e4cc">绿色 = 把梯度加起来；紫色 = 用梯度更新权重。这是两个不同过程。</text><rect x="28" y="150" width="1844" height="425" fill="#192332"/><text x="53" y="194.9" font-size="30" fill="#e4edf9">A｜实测：同一次更新的两张卡</text><text x="53" y="235.46" font-size="22" fill="#a6b9d1">global256 · micro16 · 4/8GiB梯度缓存 · 第2次更新 · 只画已有计时边界，未虚构线程事件</text><line x1="250.0" y1="253" x2="250.0" y2="425" stroke="#334155" stroke-width="1"/><text x="238.0" y="447.67" font-size="19" fill="#9fb1c8">0s</text><line x1="450.0" y1="253" x2="450.0" y2="425" stroke="#334155" stroke-width="1"/><text x="438.0" y="447.67" font-size="19" fill="#9fb1c8">10s</text><line x1="650.0" y1="253" x2="650.0" y2="425" stroke="#334155" stroke-width="1"/><text x="638.0" y="447.67" font-size="19" fill="#9fb1c8">20s</text><line x1="850.0" y1="253" x2="850.0" y2="425" stroke="#334155" stroke-width="1"/><text x="838.0" y="447.67" font-size="19" fill="#9fb1c8">30s</text><line x1="1050.0" y1="253" x2="1050.0" y2="425" stroke="#334155" stroke-width="1"/><text x="1038.0" y="447.67" font-size="19" fill="#9fb1c8">40s</text><line x1="1250.0" y1="253" x2="1250.0" y2="425" stroke="#334155" stroke-width="1"/><text x="1238.0" y="447.67" font-size="19" fill="#9fb1c8">50s</text><line x1="1450.0" y1="253" x2="1450.0" y2="425" stroke="#334155" stroke-width="1"/><text x="1438.0" y="447.67" font-size="19" fill="#9fb1c8">60s</text><line x1="1650.0" y1="253" x2="1650.0" y2="425" stroke="#334155" stroke-width="1"/><text x="1638.0" y="447.67" font-size="19" fill="#9fb1c8">70s</text><text x="60" y="302.25" font-size="25" fill="#e4edf9">3号卡主阶段</text><rect x="250.0" y="269" width="1247.6314075989649" height="49" fill="#2477a4"/><text x="259.0" y="297.53" font-size="21" fill="#ffffff">前后向＋梯度搬运＋CPU累加＋排空</text><rect x="1497.6314075989649" y="269" width="26.520913396961987" height="49" fill="#b67a18"/><rect x="1524.1523209959269" y="269" width="253.00134000368416" height="49" fill="#7958b2"/><text x="1533.1523209959269" y="297.53" font-size="21" fill="#ffffff">CPUAdam＋回传</text><rect x="1777.153660999611" y="269" width="7.913626600056887" height="49" fill="#bf455b"/><text x="1455.6314075989649" y="258.67" font-size="19" fill="#ffd48d">62.38s</text><text x="60" y="386.25" font-size="25" fill="#e4edf9">4号卡主阶段</text><rect x="250.0" y="353" width="1194.0455078007653" height="49" fill="#2477a4"/><text x="259.0" y="381.53" font-size="21" fill="#ffffff">前后向＋梯度搬运＋CPU累加＋排空</text><rect x="1444.0455078007653" y="353" width="80.10940060019493" height="49" fill="#b67a18"/><rect x="1524.1549084009603" y="353" width="260.9001384023577" height="49" fill="#7958b2"/><text x="1533.1549084009603" y="381.53" font-size="21" fill="#ffffff">CPUAdam＋回传</text><rect x="1785.055046803318" y="353" width="0.4" height="49" fill="#bf455b"/><text x="1402.0455078007653" y="342.67" font-size="19" fill="#ffd48d">59.70s</text><text x="62" y="500.32" font-size="24" fill="#f1a9b3">蓝色内部：3号主线程等空槽累计35.91s；4号26.46s。没有逐事件位置，不能铺成连续红条。</text><text x="62" y="540.39" font-size="23" fill="#b5c5da">黄色：本地范数＋同步；63.71s后两卡开始更新。末尾这一步3号等4号约0.396s。</text><rect x="28" y="600" width="1844" height="765" fill="#192332"/><text x="53" y="644.9" font-size="30" fill="#e4edf9">B｜放大蓝色内部：并发与“谁等谁”的机制</text><text x="53" y="685.46" font-size="22" fill="#a6b9d1">以下是代码对应的执行示意，不是实测事件时序；为看清堵塞只画2个接收槽，实际每卡有16个槽</text><text x="53" y="768.25" font-size="25" fill="#e4edf9">训练主线程</text><line x1="270" y1="799" x2="1800" y2="799" stroke="#2c3b50" stroke-width="1"/><text x="53" y="875.25" font-size="25" fill="#e4edf9">NPU执行流</text><line x1="270" y1="906" x2="1800" y2="906" stroke="#2c3b50" stroke-width="1"/><text x="53" y="982.25" font-size="25" fill="#e4edf9">CPU累加线程</text><line x1="270" y1="1013" x2="1800" y2="1013" stroke="#2c3b50" stroke-width="1"/><text x="53" y="1089.25" font-size="25" fill="#e4edf9">CPU接收槽A</text><line x1="270" y1="1120" x2="1800" y2="1120" stroke="#2c3b50" stroke-width="1"/><text x="53" y="1196.25" font-size="25" fill="#e4edf9">CPU接收槽B</text><line x1="270" y1="1227" x2="1800" y2="1227" stroke="#2c3b50" stroke-width="1"/><line x1="270.0" y1="710" x2="270.0" y2="1230" stroke="#26384c" stroke-width="1"/><line x1="548.1818181818182" y1="710" x2="548.1818181818182" y2="1230" stroke="#26384c" stroke-width="1"/><line x1="826.3636363636364" y1="710" x2="826.3636363636364" y2="1230" stroke="#26384c" stroke-width="1"/><line x1="1104.5454545454545" y1="710" x2="1104.5454545454545" y2="1230" stroke="#26384c" stroke-width="1"/><line x1="1382.7272727272727" y1="710" x2="1382.7272727272727" y2="1230" stroke="#26384c" stroke-width="1"/><line x1="1660.9090909090908" y1="710" x2="1660.9090909090908" y2="1230" stroke="#26384c" stroke-width="1"/><rect x="270.0" y="735" width="139.09090909090912" height="49" fill="#2477a4"/><text x="279.0" y="760.74" font-size="18" fill="#ffffff">提交A</text><rect x="409.0909090909091" y="735" width="278.18181818181813" height="49" fill="#2477a4"/><text x="418.0909090909091" y="761.67" font-size="19" fill="#ffffff">继续反向/提交B</text><rect x="687.2727272727273" y="735" width="208.63636363636374" height="49" fill="#2477a4"/><text x="696.2727272727273" y="761.67" font-size="19" fill="#ffffff">继续反向</text><rect x="895.909090909091" y="735" width="278.181818181818" height="49" fill="#bf455b"/><text x="904.909090909091" y="762.6" font-size="20" fill="#ffffff">槽满：等空槽</text><rect x="1174.090909090909" y="735" width="180.81818181818198" height="49" fill="#2477a4"/><text x="1183.090909090909" y="761.67" font-size="19" fill="#ffffff">提交C</text><rect x="1354.909090909091" y="735" width="445.090909090909" height="49" fill="#2477a4"/><text x="1363.909090909091" y="763.53" font-size="21" fill="#ffffff">继续训练</text><rect x="270.0" y="842" width="139.09090909090912" height="49" fill="#2477a4"/><text x="279.0" y="867.74" font-size="18" fill="#ffffff">计算A</text><rect x="409.0909090909091" y="842" width="139.09090909090912" height="49" fill="#bf742d"/><text x="418.0909090909091" y="867.74" font-size="18" fill="#ffffff">D2H A</text><rect x="548.1818181818182" y="842" width="139.090909090909" height="49" fill="#2477a4"/><text x="557.1818181818182" y="867.74" font-size="18" fill="#ffffff">计算B</text><rect x="687.2727272727273" y="842" width="139.09090909090912" height="49" fill="#bf742d"/><text x="696.2727272727273" y="867.74" font-size="18" fill="#ffffff">D2H B</text><rect x="826.3636363636364" y="842" width="139.090909090909" height="49" fill="#2477a4"/><text x="835.3636363636364" y="866.81" font-size="17" fill="#ffffff">已排队任务</text><rect x="965.4545454545454" y="842" width="208.63636363636363" height="49" fill="#445368"/><text x="974.4545454545454" y="865.88" font-size="16" fill="#ffffff">队列耗尽可空闲</text><rect x="1174.090909090909" y="842" width="180.81818181818198" height="49" fill="#bf742d"/><text x="1183.090909090909" y="868.67" font-size="19" fill="#ffffff">D2H C</text><rect x="1354.909090909091" y="842" width="445.090909090909" height="49" fill="#2477a4"/><text x="1363.909090909091" y="870.53" font-size="21" fill="#ffffff">后续计算</text><rect x="409.0909090909091" y="949" width="139.09090909090912" height="49" fill="#445368"/><text x="418.0909090909091" y="972.88" font-size="16" fill="#ffffff">等A传完</text><rect x="548.1818181818182" y="949" width="625.9090909090908" height="49" fill="#168f71"/><text x="557.1818181818182" y="979.39" font-size="23" fill="#ffffff">CPU：把A加进累计梯度</text><rect x="1174.090909090909" y="949" width="625.909090909091" height="49" fill="#168f71"/><text x="1183.090909090909" y="979.39" font-size="23" fill="#ffffff">CPU：把B加进累计梯度</text><rect x="409.0909090909091" y="1056" width="764.9999999999999" height="49" fill="#445368"/><text x="418.0909090909091" y="1086.39" font-size="23" fill="#ffffff">A正在接收/累加，槽不能复用</text><rect x="1174.090909090909" y="1056" width="625.909090909091" height="49" fill="#bf742d"/><text x="1183.090909090909" y="1086.39" font-size="23" fill="#ffffff">槽A腾出，接收新的C</text><rect x="687.2727272727273" y="1163" width="1112.7272727272727" height="49" fill="#445368"/><text x="696.2727272727273" y="1193.39" font-size="23" fill="#ffffff">B已排队，等CPU处理完成后才归还槽</text><line x1="1174.090909090909" y1="998" x2="1174.090909090909" y2="785" stroke="#62dcc0" stroke-width="3"/><line x1="1174.090909090909" y1="785" x2="1181.9959037184394" y2="796.5546986087355" stroke="#62dcc0" stroke-width="3"/><line x1="1174.090909090909" y1="785" x2="1166.1859144633786" y2="796.5546986087355" stroke="#62dcc0" stroke-width="3"/><text x="1186.090909090909" y="924.53" font-size="21" fill="#85e1c9">A累加完 → 归还槽 → 主线程继续</text><line x1="548.1818181818182" y1="891" x2="548.1818181818182" y2="949" stroke="#62dcc0" stroke-width="3"/><line x1="548.1818181818182" y1="949" x2="540.2768235542877" y2="937.4453013912645" stroke="#62dcc0" stroke-width="3"/><line x1="548.1818181818182" y1="949" x2="556.0868128093488" y2="937.4453013912645" stroke="#62dcc0" stroke-width="3"/><text x="576.0" y="1026.46" font-size="22" fill="#85e1c9">绿色与NPU后续任务可并行；不能把两条泳道的时间相加。</text><text x="53" y="1280.46" font-size="22" fill="#b6c6dc">当前没有独立D2H流：橙色搬运与蓝色NPU计算在同一执行流依次排队；绿色CPU工作另在线程里进行。</text><text x="53" y="1320.46" font-size="22" fill="#b6c6dc">4号8GiB驻留梯度在NPU内累加，16个micro结束后才卸载一次；这部分不逐micro进入上方CPU队列。</text><rect x="28" y="1390" width="1844" height="385" fill="#192332"/><text x="53" y="1434.9" font-size="30" fill="#e4edf9">C｜蓝色结束前先排空，之后裁剪，再进入紫色</text><text x="53" y="1475.46" font-size="22" fill="#a6b9d1">排空 = 等NPU驻留梯度卸载、CPU队列累加都完成；不是丢弃梯度</text><rect x="52" y="1515" width="160" height="49" fill="#2477a4"/><text x="61" y="1543.53" font-size="21" fill="#ffffff">反向全部完成</text><rect x="395" y="1515" width="280" height="49" fill="#168f71"/><text x="404" y="1543.53" font-size="21" fill="#ffffff">梯度搬运/累加收尾</text><rect x="945" y="1515" width="260" height="49" fill="#b67a18"/><text x="954" y="1543.53" font-size="21" fill="#ffffff">全局范数与裁剪</text><rect x="1460" y="1515" width="350" height="49" fill="#7958b2"/><text x="1469" y="1543.53" font-size="21" fill="#ffffff">CPUAdam更新＋权重回传</text><line x1="222" y1="1540" x2="383" y2="1540" stroke="#8da5c5" stroke-width="3"/><line x1="383" y1="1540" x2="371.4453013912645" y2="1547.9049946275304" stroke="#8da5c5" stroke-width="3"/><line x1="383" y1="1540" x2="371.4453013912645" y2="1532.0950053724696" stroke="#8da5c5" stroke-width="3"/><line x1="685" y1="1540" x2="933" y2="1540" stroke="#8da5c5" stroke-width="3"/><line x1="933" y1="1540" x2="921.4453013912645" y2="1547.9049946275304" stroke="#8da5c5" stroke-width="3"/><line x1="933" y1="1540" x2="921.4453013912645" y2="1532.0950053724696" stroke="#8da5c5" stroke-width="3"/><line x1="1215" y1="1540" x2="1448" y2="1540" stroke="#8da5c5" stroke-width="3"/><line x1="1448" y1="1540" x2="1436.4453013912646" y2="1547.9049946275304" stroke="#8da5c5" stroke-width="3"/><line x1="1448" y1="1540" x2="1436.4453013912646" y2="1532.0950053724696" stroke="#8da5c5" stroke-width="3"/><text x="53" y="1636.18" font-size="26" fill="#88e4cc">我们一直优化的CPU梯度累加 = B中的绿色，属于A的蓝色大阶段；紫色不是那个累加。</text><text x="53" y="1686.39" font-size="23" fill="#c9b9ee">紫色内部已有部分并发：更新下一组CPU参数时，可回传上一组新权重；不是所有小操作都串行。</text><text x="53" y="1730.46" font-size="22" fill="#f2b5bc">主要堵塞链：CPU归还接收槽不够快 → 主线程等槽 → 后续任务下发受阻；何时NPU空闲要看设备trace。</text><text x="48" y="1831.39" font-size="23" fill="#9fb1c8">数据来源：sql-cache-tail-results.json，4/8GiB组第2步；B只说明机制，不用于计算任何性能收益。</text><text x="48" y="1877.39" font-size="23" fill="#9fb1c8">不要把35.91s理解为连续停机，也不要把黄色整段理解为纯等待。大阶段关系与内部线程并发要分开看。</text></svg></main><script>function zoom(n){document.querySelector('svg').style.width=(n*100)+'%'}function go(y){const s=document.querySelector('svg');window.scrollTo({top:s.getBoundingClientRect().top+window.scrollY+y*s.getBoundingClientRect().width/1900-65,behavior:'smooth'})}</script></html>
