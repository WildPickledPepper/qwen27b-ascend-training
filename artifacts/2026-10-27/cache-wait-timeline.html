<!doctype html><html lang="zh"><meta charset="utf-8"><title>双卡训练：谁在等谁</title><style>body{font:17px "Microsoft YaHei",sans-serif;background:#f4f7fb;color:#233247;margin:32px}main{max-width:1400px;margin:auto}h1{font-size:30px}button{padding:10px 20px;margin:6px;border:1px solid #ccd7e3;border-radius:8px;background:white;cursor:pointer}svg{width:100%;background:white;border-radius:14px;margin-top:16px}.note{padding:20px;background:#e6edf7;border-radius:12px;line-height:1.9}#detail{min-height:52px;padding:15px;font-size:18px}</style><main><h1>谁在等谁：双卡训练时间线</h1><p>4/8 GiB 缓存，第2次更新，256个样本。鼠标悬停色块查看实际区间。</p><button onclick="render(0,78)">全程</button><button onclick="render(58,66)">范数同步处</button><button onclick="render(75,77)">末尾等待处</button><svg id="chart" viewBox="0 0 1400 360"></svg><div id="detail"></div><div class="note">蓝：前后向＋梯度排空；黄：本地范数＋全局同步；紫：CPU更新＋转换＋权重回传；红：末尾等待另一张卡。<br>4号提前约2.68秒完成前后向，但到63.71秒两张卡同时开始更新。黄色未拆出纯同步等待。<br>主线程等CPU接收槽累计：3号35.91秒、4号26.46秒，分散在蓝色阶段内，不能画成连续空闲或直接相加。</div></main><script>const rows=[{"card": 3, "fb": 62.38157037994824, "norm_end": 63.70761604979634, "barrier_start": 76.35768304998055, "end": 76.7533643799834, "slot_wait": 35.91433866578154, "segments": [[0, 62.38157037994824, "前后向＋梯度排空", "#3b82b0"], [62.38157037994824, 63.70761604979634, "本地范数＋全局同步", "#e5a329"], [63.70761604979634, 76.35768304998055, "CPU更新＋转换＋权重回传", "#8262bc"], [76.35768304998055, 76.7533643799834, "末尾等待另一张卡", "#df5866"]]}, {"card": 4, "fb": 59.70227539003827, "norm_end": 63.70774542004801, "barrier_start": 76.7527523401659, "end": 76.75367532018572, "slot_wait": 26.464524287031963, "segments": [[0, 59.70227539003827, "前后向＋梯度排空", "#3b82b0"], [59.70227539003827, 63.70774542004801, "本地范数＋全局同步", "#e5a329"], [63.70774542004801, 76.7527523401659, "CPU更新＋转换＋权重回传", "#8262bc"], [76.7527523401659, 76.75367532018572, "末尾等待另一张卡", "#df5866"]]}];const svg=document.getElementById('chart');const ns='http://www.w3.org/2000/svg';function el(tag,attrs,text){const e=document.createElementNS(ns,tag);Object.entries(attrs).forEach(([k,v])=>e.setAttribute(k,v));if(text!==undefined)e.textContent=text;svg.append(e);return e}function render(a,b){svg.replaceChildren();const x=t=>140+(t-a)/(b-a)*1200;for(let i=0;i<=10;i++){let t=a+(b-a)*i/10;el('line',{x1:x(t),x2:x(t),y1:30,y2:290,stroke:'#dde4ed'});el('text',{x:x(t)-15,y:325,fill:'#65758b','font-size':17},t.toFixed(1)+'s')}rows.forEach((r,i)=>{let y=70+i*130;el('text',{x:25,y:y+36,'font-size':24},r.card+'号卡');r.segments.forEach(([st,en,label,c])=>{let l=Math.max(st,a),u=Math.min(en,b);if(u<=l)return;const rect=el('rect',{x:x(l),y,width:Math.max(.7,x(u)-x(l)),height:66,fill:c});const detail=r.card+'号卡 · '+label+'：'+st.toFixed(3)+'–'+en.toFixed(3)+'秒，持续 '+(en-st).toFixed(3)+'秒';rect.addEventListener('mouseenter',()=>document.getElementById('detail').textContent=detail);const tt=document.createElementNS(ns,'title');tt.textContent=detail;rect.append(tt);if(x(u)-x(l)>260)el('text',{x:x(l)+12,y:y+39,fill:'white','font-size':19,'pointer-events':'none'},label)});});}render(0,78)</script></html>
